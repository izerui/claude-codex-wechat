name: Publish Relay Image

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-relay-image.yml'
      - 'relay-server/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-relay-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/relay-server
          tags: |
            type=raw,value=latest

      - name: Build and push relay image
        uses: docker/build-push-action@v6
        with:
          context: ./relay-server
          file: ./relay-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-relay:
    needs: publish-relay-image
    runs-on: ubuntu-latest
    # 仅在推送/手动触发时部署；镜像 tag 固定为 latest，靠重启 Deployment 拉取新镜像。
    # 需要在仓库 Settings > Secrets and variables > Actions 里配置：
    #   secrets.KUBE_CONFIG        —— base64 编码的 kubeconfig 内容
    #   vars.RELAY_K8S_NAMESPACE   —— 目标 namespace（可选，默认 default）
    #   vars.RELAY_K8S_DEPLOYMENT  —— Deployment 名称（可选，默认 relay-server）
    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Restart relay-server deployment
        env:
          NAMESPACE: ${{ vars.RELAY_K8S_NAMESPACE || 'prod' }}
          DEPLOYMENT: ${{ vars.RELAY_K8S_DEPLOYMENT || 'relay-server' }}
        run: |
          kubectl -n "$NAMESPACE" rollout restart deployment/"$DEPLOYMENT"
          kubectl -n "$NAMESPACE" rollout status deployment/"$DEPLOYMENT" --timeout=180s
